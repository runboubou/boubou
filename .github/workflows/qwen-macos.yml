name: Qwen Mac runtime

# Pull requests build the package and check two guided profiles. The weekly
# run, manual runs and releases check every profile.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'native/**'
      - 'packaging/**'
      - '!packaging/**/*.md'
      - 'build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/qwen-macos.yml'
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
    inputs:
      all_profiles:
        description: Check every profile, not only the pull request subset
        type: boolean
        default: true
  workflow_call:
    inputs:
      all_profiles:
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: qwen-mac-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  candidate:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Choose profiles
        env:
          ALL: ${{ github.event_name == 'schedule' || inputs.all_profiles == true }}
        run: |
          all="qwen3-tts:1.7b-customvoice qwen3-tts:0.6b-customvoice kokoro:82m phonon:31m-en supertonic:3 chattts:en"
          all+=" qwen3-tts:1.7b-customvoice-whisper qwen3-tts:0.6b-customvoice-whisper chattts:whisper"
          # Pocket profiles share snapshots: the default, the smallest (SentencePiece) and French.
          all+=" pocket-tts:english_2026-10 pocket-tts:english_2m_2026-10 pocket-tts:french"
          # KittenTTS: the default, the int8 quantization and a 0.1 checkpoint that names voices only by ID.
          all+=" kitten-tts:mini-0.8 kitten-tts:nano-0.8-int8 kitten-tts:nano-0.1"
          if [ "$ALL" = true ]; then
            profiles="$all"
          else
            profiles="qwen3-tts:0.6b-customvoice pocket-tts:english_2026-10"
          fi
          echo "PROFILES=$profiles" >> "$GITHUB_ENV"
      - name: Build the relocatable arm64 runtime and lock the model files
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/qwen"
          mkdir -p "$target"
          python -B packaging/qwen/lock_models.py "$target/models.json"
          python -B packaging/qwen/build_runner.py "$target"
      - name: Build and install the npm candidate outside the checkout
        env:
          BOUBOU_HOME: ${{ runner.temp }}/qwen-cache
        run: |
          set -euo pipefail
          cargo fetch --locked
          python -B packaging/build-macos.py --qwen "$RUNNER_TEMP/qwen"
          tarball=$(find "$PWD/target/dist" -name 'boubou-*.tgz')
          cd "$RUNNER_TEMP"
          mkdir -p qwen-npm
          npm install --prefix qwen-npm --no-audit --no-fund --ignore-scripts "$tarball"
          cli="$RUNNER_TEMP/qwen-npm/node_modules/.bin/boubou"
          "$cli" list | grep -Fx 'qwen3-tts:1.7b-customvoice'
          "$cli" list | grep -Fx 'qwen3-tts:0.6b-customvoice'
          "$cli" list | grep -Fx 'kokoro:82m'
          "$cli" list | grep -Fx 'phonon:31m-en'
          "$cli" list | grep -Fx 'supertonic:3'
          "$cli" list | grep -Fx 'chattts:en'
          test "$("$cli" list | grep -c '^pocket-tts:')" -eq 26
          test "$("$cli" list | grep -c '^kitten-tts:')" -eq 7
          # Later pulls must reuse, never rewrite, files the first profile downloaded.
          # shellcheck disable=SC2086 # PROFILES is a space-separated list.
          set -- $PROFILES
          "$cli" pull "$1"
          find "$BOUBOU_HOME/qwen/hub" -type f -exec stat -f '%i %m %N' {} + | LC_ALL=C sort > before
          shift
          for id in "$@"; do
            "$cli" pull "$id"
          done
          find "$BOUBOU_HOME/qwen/hub" -type f -exec stat -f '%i %m %N' {} + | LC_ALL=C sort > after
          test -z "$(LC_ALL=C comm -23 before after)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qwen-mac-candidate
          retention-days: 3
          compression-level: 0
          path: |
            ${{ runner.temp }}/qwen/runtime.json
            ${{ runner.temp }}/qwen/models.json
            target/dist/**/*.tgz
      - name: Check offline speech inference through the loopback service
        run: |
          set -euo pipefail
          export BOUBOU_HOME="$RUNNER_TEMP/qwen-cache"
          root="$BOUBOU_HOME/qwen"
          cli="$RUNNER_TEMP/qwen-npm/node_modules/.bin/boubou"
          manifest="$RUNNER_TEMP/qwen-npm/node_modules/boubou/qwen/models.json"
          sha=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["sha256"])' "$RUNNER_TEMP/qwen/runtime.json")
          python="$root/runtimes/$sha/installed/bin/python3"
          sw_vers -productVersion
          sysctl hw.model hw.memsize
          status=0
          for id in $PROFILES; do
            "$cli" pull "$id" --offline || { status=1; continue; }
            "$python" -I -B packaging/qwen/smoke.py "$id" "$root" "$manifest" || status=1
            "$cli" doctor "$id" || status=1
          done
          exit "$status"
