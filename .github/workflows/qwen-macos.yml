name: Qwen Mac runtime

# Pull requests that change the modular runtime build the package and check two
# guided profiles. Quality covers the Rust side of every pull request. The
# weekly run and manual runs check every profile. So does a release, unless an
# earlier release already checked every profile on the same runner and model files.
on:
  pull_request:
    paths:
      - 'packaging/qwen/**'
      - '!packaging/qwen/**/*.md'
      - 'packaging/build-macos.py'
      - 'src/modular.rs'
      - 'src/modular/**'
      - '.github/workflows/qwen-macos.yml'
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
    inputs:
      all_profiles:
        description: Check every profile, not only the pull request subset
        type: boolean
        default: true
  workflow_call:
    inputs:
      all_profiles:
        type: boolean
        default: true
      reuse:
        description: Reuse the newest published runner while its sources are unchanged
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: qwen-mac-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The npm package also carries the x86-64 Linux CLI.
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: ALSA headers
        # Canonical's mirror names sometimes stop resolving. apt verifies the archive's signatures,
        # so a kernel.org mirror after the runner's own list is a safe fallback.
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            echo 'http://mirrors.edge.kernel.org/ubuntu/' | sudo tee -a /etc/apt/apt-mirrors.txt > /dev/null
          fi
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - name: Build the Linux CLI
        run: cargo build --locked --release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boubou-linux-x64
          retention-days: 3
          path: target/release/boubou

  candidate:
    needs: linux
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build or reuse the relocatable arm64 runtime and lock the model files
        env:
          REUSE: ${{ inputs.reuse == true }}
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/qwen"
          mkdir -p "$target"
          python -B packaging/qwen/lock_models.py "$target/models.json"
          # npm cannot carry the runner. The Release workflow uploads a new one to this URL.
          version=$(python -c 'import json; print(json.load(open("packaging/package.json"))["version"])')
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$version/boubou-qwen-runner-$version-darwin-arm64.tar.gz"
          if [ "$REUSE" = true ]; then
            # The newest published package names the runner and model files its release verified.
            newest=$(npm view boubou time --json | jq -r 'del(.created, .modified) | to_entries | max_by(.value).key')
            mkdir "$RUNNER_TEMP/published"
            curl -fsSL --retry 5 --retry-all-errors "$(npm view "boubou@$newest" dist.tarball)" |
              tar -xzf - -C "$RUNNER_TEMP/published" --strip-components 2 package/qwen
            set -- --reuse "$RUNNER_TEMP/published/runtime.json"
          fi
          python -B packaging/qwen/build_runner.py "$target" --url "$url" "$@"
      - name: Choose profiles
        env:
          ALL: ${{ github.event_name == 'schedule' || inputs.all_profiles == true }}
        run: |
          all="qwen3-tts:1.7b-customvoice qwen3-tts:0.6b-customvoice kokoro:82m phonon:31m-en supertonic:3 chattts:en"
          all+=" qwen3-tts:1.7b-customvoice-whisper qwen3-tts:0.6b-customvoice-whisper chattts:whisper"
          # Pocket profiles share snapshots: the default, the smallest (SentencePiece) and French.
          all+=" pocket-tts:english_2026-10 pocket-tts:english_2m_2026-10 pocket-tts:french"
          # KittenTTS: the default, the int8 quantization and a 0.1 checkpoint that names voices only by ID.
          all+=" kitten-tts:mini-0.8 kitten-tts:nano-0.8-int8 kitten-tts:nano-0.1"
          # A release that changed neither the runner nor the model files repeats only the pull request
          # subset: the release that published them checked every profile on these exact bytes.
          published() { cmp -s "$RUNNER_TEMP/published/$1" "$RUNNER_TEMP/qwen/$1"; }
          if [ "$ALL" = true ] && ! { published runtime.json && published models.json; }; then
            profiles="$all"
          else
            profiles="qwen3-tts:0.6b-customvoice pocket-tts:english_2026-10"
          fi
          echo "PROFILES=$profiles" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: boubou-linux-x64
          path: ${{ runner.temp }}/linux
      - name: Lock the Linux model files beside the published Linux runner
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/linux/qwen"
          cp packaging/qwen/runner-linux-x64.json "$RUNNER_TEMP/linux/qwen/runtime.json"
          python -B packaging/qwen/lock_models.py --cuda "$RUNNER_TEMP/linux/qwen/models.json"
      - name: Build and install the npm candidate outside the checkout
        env:
          BOUBOU_HOME: ${{ runner.temp }}/qwen-cache
        run: |
          set -euo pipefail
          cargo fetch --locked
          python -B packaging/build-macos.py --qwen "$RUNNER_TEMP/qwen" --linux "$RUNNER_TEMP/linux"
          tarball=$(find "$PWD/target/dist" -name 'boubou-*.tgz')
          tar -tzf "$tarball" | grep -Fx "package/linux-x64/boubou"
          # A new runner is not a release asset before the tag; place the exact runner where `pull` would download it.
          sha=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["sha256"])' "$RUNNER_TEMP/qwen/runtime.json")
          mkdir -p "$BOUBOU_HOME/qwen/runtimes/$sha"
          cp "$RUNNER_TEMP/qwen/runner.tar.gz" "$BOUBOU_HOME/qwen/runtimes/$sha/"
          cd "$RUNNER_TEMP"
          mkdir -p qwen-npm
          npm install --prefix qwen-npm --no-audit --no-fund --ignore-scripts "$tarball"
          cli="$RUNNER_TEMP/qwen-npm/node_modules/.bin/boubou"
          "$cli" list | grep -Fx 'qwen3-tts:1.7b-customvoice'
          "$cli" list | grep -Fx 'qwen3-tts:0.6b-customvoice'
          "$cli" list | grep -Fx 'kokoro:82m'
          "$cli" list | grep -Fx 'phonon:31m-en'
          "$cli" list | grep -Fx 'supertonic:3'
          "$cli" list | grep -Fx 'chattts:en'
          test "$("$cli" list | grep -c '^pocket-tts:')" -eq 26
          test "$("$cli" list | grep -c '^kitten-tts:')" -eq 7
          # Downloads resume from the partial file, so a dropped connection only costs a retry.
          pull() {
            for attempt in 1 2 3; do
              "$cli" pull "$1" && return
              sleep $((attempt * 30))
            done
            return 1
          }
          # Later pulls must reuse, never rewrite, files the first profile downloaded.
          # shellcheck disable=SC2086 # PROFILES is a space-separated list.
          set -- $PROFILES
          pull "$1"
          find "$BOUBOU_HOME/qwen/hub" -type f -exec stat -f '%i %m %N' {} + | LC_ALL=C sort > before
          shift
          for id in "$@"; do
            pull "$id"
          done
          find "$BOUBOU_HOME/qwen/hub" -type f -exec stat -f '%i %m %N' {} + | LC_ALL=C sort > after
          test -z "$(LC_ALL=C comm -23 before after)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qwen-mac-candidate
          retention-days: 3
          compression-level: 0
          path: |
            ${{ runner.temp }}/qwen/runtime.json
            ${{ runner.temp }}/qwen/models.json
            ${{ runner.temp }}/qwen/runner.tar.gz
            target/dist/**/*.tgz
      - name: Check offline speech inference through the loopback service
        run: |
          set -euo pipefail
          export BOUBOU_HOME="$RUNNER_TEMP/qwen-cache"
          root="$BOUBOU_HOME/qwen"
          cli="$RUNNER_TEMP/qwen-npm/node_modules/.bin/boubou"
          manifest="$RUNNER_TEMP/qwen-npm/node_modules/boubou/qwen/models.json"
          sha=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["sha256"])' "$RUNNER_TEMP/qwen/runtime.json")
          python="$root/runtimes/$sha/installed/bin/python3"
          sw_vers -productVersion
          sysctl hw.model hw.memsize
          status=0
          for id in $PROFILES; do
            "$cli" pull "$id" --offline || { status=1; continue; }
            "$python" -I -B packaging/qwen/smoke.py "$id" "$root" "$manifest" || status=1
            "$cli" doctor "$id" || status=1
          done
          exit "$status"
