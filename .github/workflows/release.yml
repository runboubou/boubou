name: Release

# Pushing a v* tag (maintainers only) checks every profile, then publishes the
# exact tested tarball to npm through trusted publishing.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/qwen-macos.yml
    with:
      all_profiles: true

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # GitHub release
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qwen-mac-candidate
          path: candidate
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish to npm
        run: |
          set -euo pipefail
          tarball=$(find candidate -name 'boubou-*.tgz')
          version=$(basename "$tarball" .tgz)
          version=${version#boubou-}
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match package $version"; exit 1; }
          # Prereleases go to their channel (0.1.0-beta.4 -> beta); README installs boubou@beta.
          channel=latest
          if [[ "$version" == *-* ]]; then
            channel=${version#*-}
            channel=${channel%%.*}
          fi
          npm install --global npm@11
          npm publish "$tarball" --tag "$channel" --access public
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${flags[@]}"
