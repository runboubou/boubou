name: Release

# Pushing a v<version> tag (maintainers only) releases that version. It checks
# the Qwen profiles and the real Liquid models, publishes the exact tested
# tarball to npm through trusted publishing, then waits until npm serves it.
# A Qwen runner whose sources changed is built, checked on every profile and
# published as a GitHub release asset. Otherwise the package keeps the runner
# an earlier release published, so people who upgrade do not download it again.
# Until a stable version exists, the newest prerelease is also npm's `latest`,
# so plain `npx boubou` runs it.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # A tag that cannot be released fails here in seconds, not after an hour of model checks.
  tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that the tag names the version on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(jq -r .version packaging/package.json)
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in packaging/package.json. Bump the version on main, then tag that commit."
            exit 1
          }
          # main is "identical" to or "ahead" of a commit it contains.
          main=$(gh api "repos/$GITHUB_REPOSITORY/compare/$(git rev-parse HEAD)...main" --jq .status)
          test "$main" = identical || test "$main" = ahead || {
            echo "::error::$GITHUB_REF_NAME is not on main. Tag a commit that main contains."
            exit 1
          }

  verify:
    needs: tag
    uses: ./.github/workflows/qwen-macos.yml
    with:
      all_profiles: true
      reuse: true

  verify-liquid:
    needs: tag
    uses: ./.github/workflows/liquid-macos.yml

  publish:
    needs: [verify, verify-liquid]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write # GitHub release
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qwen-mac-candidate
          path: candidate
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check the candidate
        run: |
          set -euo pipefail
          tarball=$(find candidate -name 'boubou-*.tgz')
          runtime=$(find candidate -name runtime.json)
          runner=$(find candidate -name runner.tar.gz)
          version=$(basename "$tarball" .tgz)
          version=${version#boubou-}
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match package $version"; exit 1; }
          # npm publish fails above about 400 MB; the runner is a release asset instead.
          size=$(stat -c %s "$tarball")
          test "$size" -le $((32 * 1024 * 1024)) || { echo "npm tarball is $size bytes"; exit 1; }
          tar -xzOf "$tarball" package/qwen/runtime.json | cmp - "$runtime"
          # The Linux runner is published on Hugging Face before the release; make sure the package can fetch it.
          linux_url=$(tar -xzOf "$tarball" package/linux-x64/qwen/runtime.json | jq -r .url)
          curl -fsSL --retry 5 --retry-all-errors -r 0-0 -o /dev/null "$linux_url"
          url=$(jq -r .url "$runtime")
          asset=${url##*/}
          releases="https://github.com/$GITHUB_REPOSITORY/releases/download"
          test "${url%/*/*}" = "$releases" || { echo "Unexpected runner URL $url"; exit 1; }
          test "$(stat -c %s "$runner")" = "$(jq -r .size "$runtime")"
          test "$(sha256sum "$runner" | cut -d' ' -f1)" = "$(jq -r .sha256 "$runtime")"
          # Only a runner built for this version is uploaded. A reused one stays on the release that published it.
          mkdir release
          test "$url" != "$releases/$GITHUB_REF_NAME/$asset" || cp "$runner" "release/$asset"
          {
            echo "TARBALL=$tarball"
            echo "VERSION=$version"
            echo "RUNNER_URL=$url"
            echo "RUNNER_SHA=$(jq -r .sha256 "$runtime")"
          } >> "$GITHUB_ENV"
      # The package downloads the runner from a release, so it must be public before npm publish.
      - name: Publish the GitHub release, with the runner if it is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release/*)
          flags=()
          [[ "$VERSION" == *-* ]] && flags+=(--prerelease)
          # Never replace an uploaded runner: a published package may already point at it.
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --generate-notes "${flags[@]}"
          elif [ ${#assets[@]} -gt 0 ] && ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "${RUNNER_URL##*/}"; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY"
          fi
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
          curl -fsSL --retry 5 --retry-all-errors "$RUNNER_URL" -o runner-check.tar.gz
          test "$(sha256sum runner-check.tar.gz | cut -d' ' -f1)" = "$RUNNER_SHA" || {
            echo "The release already holds a different runner. Release a new version instead."
            exit 1
          }
      - name: Publish to npm and wait until it serves the version
        run: |
          set -euo pipefail
          # Prereleases go to their channel (0.1.0-beta.4 -> beta); README installs boubou@beta.
          channel=latest
          if [[ "$VERSION" == *-* ]]; then
            channel=${VERSION#*-}
            channel=${channel%%.*}
          fi
          # True once the registry hands out this exact tarball as the version.
          served() {
            local url
            url=$(curl -fs "https://registry.npmjs.org/boubou/$VERSION" | jq -er .dist.tarball) || return 1
            curl -fsL "$url" | cmp -s - "$TARBALL"
          }
          tagged() {
            curl -fs https://registry.npmjs.org/-/package/boubou/dist-tags | jq -r --arg tag "$1" '.[$tag]'
          }
          # npm can take minutes to show a new version or tag. The release is done once
          # `npx boubou@<tag>` gets it.
          wait_for() {
            for _ in $(seq 60); do
              if [ "$(tagged "$1")" = "$VERSION" ] && served; then
                echo "npx boubou@$1 now runs $VERSION"
                return 0
              fi
              sleep 30
            done
            echo "::error::npm does not serve boubou@$VERSION as $1 after 30 minutes. Re-run this job."
            return 1
          }
          # npm 11.21+ also manages dist-tags through trusted publishing.
          npm install --global npm@11
          # Re-running this job after npm accepted the tarball must not publish it again.
          if served; then
            echo "npm already serves boubou@$VERSION"
          else
            npm publish "$TARBALL" --tag "$channel" --access public
          fi
          wait_for "$channel"
          # Until a stable version exists, plain `npx boubou` runs the newest prerelease.
          latest=$(tagged latest)
          if [ "$channel" != latest ] && [[ "$latest" == *-* ]]; then
            if [ "$latest" != "$VERSION" ] && ! npm dist-tag add "boubou@$VERSION" latest; then
              echo "::error::npm refused to move latest. Turn on \"Allow npm dist-tag\" for this package's trusted publisher on npmjs.com, then re-run this job."
              exit 1
            fi
            wait_for latest
          fi
