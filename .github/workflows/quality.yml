name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Rust toolchains
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup toolchain install 1.88 --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets --all-features
      - name: Minimum supported Rust version
        run: cargo +1.88 check --locked --all-targets --all-features
      - name: Review gate
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Native playback cancellation
        run: |
          clang -O2 -fobjc-arc -mmacosx-version-min=13.0 -framework AVFoundation -framework Foundation -framework CoreAudio native/audio_tests.m -o "$RUNNER_TEMP/boubou-audio-tests"
          "$RUNNER_TEMP/boubou-audio-tests"
