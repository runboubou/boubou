name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please leave out recordings, transcripts and personal paths. Report security issues privately instead, as described in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `boubou --version`, or the commit you built.
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model ID
      placeholder: LFM3-Audio-2B
    validations:
      required: true
  - type: input
    id: machine
    attributes:
      label: Machine
      placeholder: MacBook Pro, M3, 18 GB, macOS 15.6
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: boubou doctor output
      description: Output of `boubou doctor MODEL`.
      render: text
