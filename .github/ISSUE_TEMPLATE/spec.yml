name: Specification
description: Define a material change before implementation.
title: "[Spec] "
body:
  - type: markdown
    attributes:
      value: |
        Write in English. Use a Spec for material public-command, architecture,
        permission, asset, or persistent-data changes. Opening this Issue does
        not authorize implementation. Link the maintainer's explicit approval
        when granted; keep execution results in the implementation PR.
  - type: textarea
    id: why
    attributes:
      label: Why
      description: Describe the observed problem and current behavior.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: State the observable result and user impact.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: List requirements, affected interfaces, failure behavior, compatibility, and non-goals.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: Define success/failure tests; distinguish automated, model, device, and distribution evidence.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and approval
      description: Link inspected code, alternatives, and an explicit maintainer decision when available. State pending approval honestly.
    validations:
      required: true
