name: Feature request
description: Describe a user problem and the behavior that would solve it.
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Write in English and check existing Issues first. A feature request is a
        proposal, not implementation or release approval. Material interface,
        architecture, permission, or persistence changes may need an approved Spec.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the current limitation and who it affects.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior rather than prescribing a new framework.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and boundaries
      description: Note existing workarounds, compatibility constraints, and what is outside this request.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Link relevant public documentation or safe examples; do not include private user data.
