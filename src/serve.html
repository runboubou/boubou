<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Boubou</title>
<style>
  :root { --accent: #f2c21b; --ink: #17171a; --level: 0; --mouth: 0; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-items: center;
    padding: max(20px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)); background: radial-gradient(120% 70% at 50% 30%, #fffdf7, #f3efe4); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; overflow-x: hidden;
  }
  main { display: grid; justify-items: center; gap: 14px; width: 100%; max-width: 30rem; }
  h1 { margin: 0; font-size: 1rem; font-weight: 600; letter-spacing: .08em; }
  /* The character, drawn on white: a light page keeps her hair as drawn. She breathes and sways
     while idle, leans in while listening, and moves her mouth with her voice. */
  .stage {
    position: relative; width: min(100%, 25rem, 50dvh); aspect-ratio: 1122 / 1402;
    transform: translateY(calc(var(--level) * -5px)) rotate(var(--lean, 0deg));
    transform-origin: 50% 100%; transition: transform .5s cubic-bezier(.3, .7, .4, 1);
  }
  [data-state="you"] .stage { --lean: 1.4deg; }
  [data-state="boubou"] .stage { transition-duration: .12s; }
  .glow {
    position: absolute; inset: 2% -14% 20%; border-radius: 50%;
    background: radial-gradient(closest-side, color-mix(in srgb, var(--accent) 22%, transparent), transparent);
    opacity: calc(.6 + var(--level) * .4); transform: scale(calc(1 + var(--level) * .08));
    transition: opacity .12s linear, transform .12s linear;
  }
  .sway { position: absolute; inset: 0; transform-origin: 50% 100%; animation: sway 7s ease-in-out infinite; }
  .breath {
    position: absolute; inset: 0; transform-origin: 50% 100%; animation: breathe 4.2s ease-in-out infinite;
    -webkit-mask-image: linear-gradient(#000 74%, transparent 99%); mask-image: linear-gradient(#000 74%, transparent 99%);
  }
  .breath img, .breath svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .mouth { fill: #6e2534; stroke: #a8505c; stroke-width: 1.5; transform-box: fill-box; transform-origin: 50% 0; transform: scale(calc(.72 + var(--mouth) * .28), var(--mouth)); }
  @keyframes sway { 0%, 100% { rotate: -.6deg; } 50% { rotate: .6deg; } }
  @keyframes breathe { 0%, 100% { scale: 1 1; } 50% { scale: 1.004 1.012; } }
  button {
    width: 120px; aspect-ratio: 1; margin-top: -56px; border-radius: 50%; cursor: pointer; position: relative;
    border: 2px solid var(--ink); background: rgb(255 253 247 / .8); color: var(--ink); font: inherit;
    font-weight: 600; transform: scale(calc(1 + var(--level) * .12));
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    box-shadow: 0 0 calc(var(--level) * 64px) color-mix(in srgb, var(--accent) 55%, transparent);
    transition: transform .08s linear, box-shadow .08s linear, background-color .2s, color .2s;
  }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 6px; }
  [data-state="you"] button { background: var(--ink); color: #fff; --accent: #17171a; }
  [data-state="boubou"] button { background: var(--accent); border-color: var(--accent); color: var(--ink); }
  p { margin: 0; min-height: 3em; max-width: 30ch; color: #5f5f68; text-wrap: balance; }
  @media (prefers-reduced-motion: reduce) {
    button, .stage, .glow { transition: none; transform: none; }
    .sway, .breath { animation: none; }
  }
</style>
<main>
  <h1>BOUBOU</h1>
  <div class="stage" aria-hidden="true">
    <div class="glow"></div>
    <div class="sway"><div class="breath">
      <img src="/character.webp" alt="" width="1000" height="1250" decoding="async">
      <svg viewBox="0 0 1122 1402"><ellipse class="mouth" cx="570" cy="436" rx="15" ry="8"/></svg>
    </div></div>
  </div>
  <button type="button">Start talking</button>
  <p role="status">Your voice goes to the computer running Boubou and nowhere else.</p>
</main>
<script>
  const button = document.querySelector('button');
  const status = document.querySelector('p');
  const privacy = status.textContent;
  // Runs on the audio thread: packs the microphone into 20 ms frames of PCM16.
  const frames = `registerProcessor('frames', class extends AudioWorkletProcessor {
    frame = new Int16Array(320);
    filled = 0;
    process([[channel]]) {
      for (const sample of channel ?? []) {
        this.frame[this.filled++] = Math.max(-1, Math.min(1, sample)) * 32767;
        if (this.filled === this.frame.length) {
          this.port.postMessage(this.frame.slice());
          this.filled = 0;
        }
      }
      return true;
    }
  });`;
  // The conversation in progress: its socket, audio contexts and scheduled speech.
  let session;

  function show(state, label, note) {
    document.body.dataset.state = state;
    document.body.style.setProperty('--level', 0);
    document.body.style.setProperty('--mouth', 0);
    button.textContent = label;
    status.textContent = note;
  }

  function level(pcm) {
    let peak = 0;
    for (const sample of pcm) peak = Math.max(peak, Math.abs(sample));
    return Math.min(1, peak / 12000);
  }

  // Safe to repeat: a start that was still waiting for the microphone releases it afterwards.
  function end(talk, note) {
    if (talk.socket) {
      talk.socket.onclose = talk.socket.onmessage = null;
      talk.socket.close();
    }
    talk.stream?.getTracks().forEach((track) => track.stop());
    talk.awake?.release();
    talk.playing.clear();
    for (const context of [talk.microphone, talk.speaker]) {
      if (context && context.state !== 'closed') context.close();
    }
    if (session !== talk) return;
    session = null;
    show('', 'Start talking', note);
  }

  async function start() {
    const key = location.hash.slice(1);
    if (!key) return show('', 'Start talking', 'This link is incomplete. Open the whole link that Boubou printed.');
    if (!navigator.mediaDevices || !window.AudioWorkletNode) {
      return show('', 'Start talking', 'This browser shares its microphone only with secure pages. Open the https link that Boubou printed.');
    }
    const talk = session = { epoch: 0, next: 0, playing: new Set() };
    show('', 'Connecting', '');
    try {
      // Both created in the tap, so the browser lets them run.
      const speaker = talk.speaker = new AudioContext({ sampleRate: 24000 });
      const microphone = talk.microphone = new AudioContext({ sampleRate: 16000 });
      if (microphone.sampleRate !== 16000 || speaker.sampleRate !== 24000) {
        throw new Error('This browser cannot record at 16 kHz and play at 24 kHz.');
      }
      // Speech passes through on its way out, so the mouth follows what is heard.
      talk.voice = speaker.createAnalyser();
      talk.voice.fftSize = 512;
      talk.voice.connect(speaker.destination);
      speak(talk);
      talk.stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      });
      if (session !== talk) return end(talk);
      // A phone that starts recording may pause what was already set up.
      speaker.resume();
      microphone.resume();
      // Keeps a phone's screen on, and with it the microphone.
      talk.awake = await navigator.wakeLock?.request('screen').catch(() => null);
      await microphone.audioWorklet.addModule(URL.createObjectURL(new Blob([frames], { type: 'text/javascript' })));
      if (session !== talk) return end(talk);
      // Boubou expects audio from the moment the page connects, so connect last.
      const socket = talk.socket = new WebSocket(`${location.origin.replace('http', 'ws')}/talk?key=${key}`);
      socket.binaryType = 'arraybuffer';
      socket.onopen = () => show('you', 'Stop', 'Listening. Pause and Boubou answers; speak and it stops.');
      socket.onclose = () => end(talk, document.body.dataset.state
        ? 'Boubou stopped or the connection dropped.'
        : 'Boubou is not running, is talking with someone else, or this link no longer has the right key.');
      socket.onmessage = ({ data }) => (typeof data === 'string' ? clear(talk, JSON.parse(data).clear) : play(talk, data));
      const capture = new AudioWorkletNode(microphone, 'frames');
      capture.port.onmessage = ({ data }) => {
        if (socket.readyState !== WebSocket.OPEN) return;
        socket.send(data);
        if (!talk.playing.size) {
          document.body.dataset.state = 'you';
          document.body.style.setProperty('--level', level(data));
        }
      };
      microphone.createMediaStreamSource(talk.stream).connect(capture).connect(microphone.destination);
    } catch (error) {
      end(talk, error.name === 'NotAllowedError' ? 'Boubou needs the microphone. Allow it for this page and try again.' : error.message);
    }
  }

  function play(talk, data) {
    const { speaker, socket, playing, epoch } = talk;
    const pcm = new Int16Array(data);
    const buffer = speaker.createBuffer(1, pcm.length, 24000);
    const samples = buffer.getChannelData(0);
    for (let i = 0; i < pcm.length; i++) samples[i] = pcm[i] / 32768;
    const source = speaker.createBufferSource();
    source.buffer = buffer;
    source.connect(talk.voice);
    // Chunks play back to back; after a gap, a short lead absorbs network jitter.
    const at = Math.max(talk.next, speaker.currentTime + 0.05);
    source.start(at);
    talk.next = at + buffer.duration;
    playing.add(source);
    setTimeout(() => {
      if (!playing.has(source)) return;
      document.body.dataset.state = 'boubou';
      document.body.style.setProperty('--level', level(pcm));
    }, (at - speaker.currentTime) * 1000);
    source.onended = () => {
      // Interrupted speech is not reported: Boubou has already stopped counting it.
      if (playing.delete(source) && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({ epoch, played: pcm.length }));
      }
    };
  }

  // Opens the mouth as wide as the speech playing now is loud, every frame until the talk ends.
  function speak(talk) {
    const samples = new Float32Array(talk.voice.fftSize);
    let open = 0;
    const frame = () => {
      if (session !== talk) return;
      talk.voice.getFloatTimeDomainData(samples);
      let sum = 0;
      for (const sample of samples) sum += sample * sample;
      open = open * .45 + Math.min(1, Math.sqrt(sum / samples.length) * 7) * .55;
      document.body.style.setProperty('--mouth', open < .06 ? 0 : open.toFixed(3));
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }

  function clear(talk, epoch) {
    for (const source of talk.playing) source.stop();
    talk.playing.clear();
    talk.epoch = epoch;
    talk.next = 0;
  }

  button.onclick = () => (session ? end(session, privacy) : start());
</script>
</html>
