[package]
name = "boubou-names"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Names on a local network and certificates browsers trust for them, for Boubou."
repository = "https://github.com/runboubou/boubou"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
instant-acme = { version = "0.8", default-features = false, features = ["hyper-rustls", "ring"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
x509-parser = { version = "0.18", features = ["verify"] }
