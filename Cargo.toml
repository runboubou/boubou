[package]
name = "boubou"
version = "0.1.0-beta.4"
edition = "2024"
rust-version = "1.91"
description = "Run voice AI locally with open-source models. Bring it to any device with one command."
repository = "https://github.com/runboubou/boubou"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.23"
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.29"
ctrlc = { version = "3.4", features = ["termination"] }
dirs = "7"
# Speech detection for audio that arrives without the platform's own: Linux and browsers.
earshot = "1.2"
flate2 = "1"
fs2 = "0.4"
hound = "3.5"
httparse = "1"
libc = "0.2"
qrcode = { version = "0.14", default-features = false }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
shlex = "2"
tar = "0.4"
tungstenite = "0.30"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }

# Linux plays and records through the default ALSA devices (PipeWire or PulseAudio)
# and cancels the reply's echo with WebRTC AEC3, all in-process.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = "0.18"
sonora = "0.3"

[profile.release]
lto = "thin"
strip = true
