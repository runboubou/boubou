[package]
name = "boubou"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Local voice conversations, one command away"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.29"
ctrlc = "3.4"
dirs = "6"
flate2 = "1"
fs2 = "0.4"
hound = "3.5"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tungstenite = "0.28"

[profile.release]
lto = "thin"
strip = true
